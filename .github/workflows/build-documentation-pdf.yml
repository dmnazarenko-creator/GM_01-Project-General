name: Build branded documentation PDFs

on:
  push:
    branches: [main]
    paths:
      - 'Projects/GM_*/**'
      - 'Projects/assets/**'
      - 'WAS_BlueWhite.png'
      - 'tools/build_pdfs.py'
      - '.github/workflows/build-documentation-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip pdf]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown Pillow
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Build PDF files
        run: python tools/build_pdfs.py
      - name: Commit PDFs into neighboring folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Projects/GM_*/PDF/
          if ! git diff --cached --quiet; then
            git commit -m "docs: update branded PDF exports [skip pdf]"
            git push
          fi
